[package]
name = "ztk-rust-sdk"
version = "0.1.0"
edition = "2021"
description = "折淘客 (ZheTaoKe/ZTK) Rust SDK - 多平台电商 API 客户端库"
license = "MIT"

[features]
default = ["taobao", "jd", "pdd"]

# 各平台独立 feature
taobao = []
jd = []
pdd = []
vip = []
meituan = []
kaola = []
eleme = []
douyin = []

# 全部平台
full = ["taobao", "jd", "pdd", "vip", "meituan", "kaola", "eleme", "douyin"]

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
url = "2.0"

[dev-dependencies]
proptest = "1.0"
wiremock = "0.5"
tokio-test = "0.4"
urlencoding = "2.1.3"
